<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc2MD - Kidmedia</title>
  <link rel="icon" type="image/png" href="app_icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-brand">
        <svg class="doc-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" fill="#3B82F6" fill-opacity="0.15" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 2V8H20" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
          <path d="M10 13L8 15L10 17" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 13L16 15L14 17" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Doc2MD</span>
      </div>
    </div>

    <div class="header-center">
      <a href="#" id="kidmedia-link" title="Kidmedia.eu" class="kidmedia-logo-wrapper">
        <img src="Kidmedia-logo.png" alt="Kidmedia Logo" class="kidmedia-logo">
      </a>
    </div>

    <div class="header-right">
      <button id="lang-btn" class="lang-selector-btn">
        <span id="current-flag" class="flag-icon"></span>
        <span id="current-lang-name">Ελληνικά</span>
        <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="app-main">
    <div class="converter-card">
      <h1 id="txt-title" class="card-title">Μετατροπή Pdf και Docx σε MD</h1>
      <p id="txt-subtitle" class="card-subtitle">Μετατρέψτε εύκολα τα αρχεία σας σε κείμενο Markdown</p>

      <div id="drop-zone" class="drop-zone">
        <div class="upload-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>

        <p id="txt-dragText" class="drag-text">Σύρετε το αρχείο εδώ</p>
        <span id="txt-formats" class="formats-subtext">.pdf, .docx, .doc, .odt</span>

        <div class="or-divider">
          <span class="line"></span>
          <span id="txt-or" class="or-text">ή</span>
          <span class="line"></span>
        </div>

        <button id="select-file-btn" class="select-file-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
          </svg>
          <span id="txt-selectBtn">Επιλογή αρχείου (pdf-docx-odt)</span>
        </button>

        <input type="file" id="hidden-file-input" accept=".pdf,.docx,.doc,.odt" style="display:none">
      </div>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div id="loading-modal" class="modal-overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="txt-converting">Μετατροπή σε εξέλιξη...</p>
    </div>
  </div>

  <!-- Language Selection Modal (Matching Language-choice.png) -->
  <div id="lang-modal" class="modal-overlay hidden">
    <div class="lang-modal-box">
      <div class="modal-header">
        <svg class="globe-header-icon" viewBox="0 0 24 24" fill="#3B82F6">
          <circle cx="12" cy="12" r="10" fill="#3B82F6"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#FFFFFF" stroke-width="1.5"/>
        </svg>
        <h2 id="txt-modalTitle">Επιλογή Γλώσσας</h2>
      </div>

      <div class="lang-grid" id="lang-grid">
        <!-- 24 EU Flag tiles injected dynamically -->
      </div>

      <button id="close-lang-btn" class="modal-cancel-btn">
        <span id="txt-cancel">Ακύρωση</span>
      </button>
    </div>
  </div>

  <!-- Markdown Preview Modal -->
  <div id="preview-modal" class="modal-overlay hidden">
    <div class="preview-modal-box">
      <div class="preview-header">
        <h2 id="txt-previewTitle">Προεπισκόπηση Markdown</h2>
        <button id="close-preview-x" class="icon-close-btn">&times;</button>
      </div>

      <div class="preview-body">
        <textarea id="markdown-output" readonly placeholder="Markdown text..."></textarea>
      </div>

      <div class="preview-footer">
        <button id="close-preview-btn" class="btn-secondary">
          <span id="txt-closeBtn">Κλείσιμο</span>
        </button>
        <button id="save-md-btn" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span id="txt-saveBtn">Αποθήκευση ως...</span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
